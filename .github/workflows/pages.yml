name: Publish Madrid Nightlife
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 8,9 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: madrid-nightlife-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate and prepare public files
        run: |
          python3 - <<'PY'
          import json, pathlib, datetime
          d=json.loads(pathlib.Path('agenda.json').read_text())
          assert isinstance(d['venues'],list) and isinstance(d['events'],list)
          ids={v['id'] for v in d['venues']}
          assert len(ids)==len(d['venues'])
          assert len({e['id'] for e in d['events']})==len(d['events'])
          for e in d['events']:
              assert e['venue'] in ids
              datetime.date.fromisoformat(e['date'])
          print(len(d['events']), 'events;',len(ids),'venues')
          PY
          mkdir -p _site
          node --check identity.js
          node --check identity-config.js
          cp index.html agenda.json worldwide.js operations.html account.html identity.js identity-config.js _site/
          python3 - <<'PY'
          import datetime, json, os, pathlib
          pathlib.Path('_site/operations-build.json').write_text(json.dumps({
              'sha': os.environ['GITHUB_SHA'],
              'builtAt': datetime.datetime.now(datetime.timezone.utc).isoformat()
          }))
          PY
          if [ -f catalog/index.json ]; then
            python3 - <<'PY'
          import json, pathlib
          base=pathlib.Path('catalog/dice')
          m=json.loads((base/'manifest.json').read_text())
          for key in ('artists','venues','review'):
              data=json.loads((base/m[key]['path']).read_text())
              rows=data['rows']
              assert len(rows)==m[key]['rows'], key
              assert all(len(row)==len(data['fields']) for row in rows), key
              if key!='review':
                  assert len({tuple(row[:3]) for row in rows})==len(rows), key
          world=json.loads(pathlib.Path('catalog/world-events.json').read_text())
          venue_map={v['id']:v for v in world['venues']}
          assert len(venue_map)==len(world['venues'])
          assert len({e['id'] for e in world['events']})==len(world['events'])
          for e in world['events']:
              v=venue_map[e['venueId']]
              assert (e['country'],e['city'])==(v['country'],v['city'])
              datetime=__import__('datetime').date
              datetime.fromisoformat(e['date'])
              if e.get('endDate'):
                  assert datetime.fromisoformat(e['endDate'])>=datetime.fromisoformat(e['date'])
              assert e['source'].startswith('https://')
          print('DICE catalog and international event references validated')
          PY
            mkdir -p _site/catalog/dice
            cp catalog/index.json catalog/world-events.json _site/catalog/
            cp catalog/dice/*.json _site/catalog/dice/
            python3 scripts/build_artist_links.py --output _site/catalog/artist-links.json
          fi
          touch _site/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
